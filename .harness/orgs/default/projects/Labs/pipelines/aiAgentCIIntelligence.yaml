pipeline:
  name: aiAgentCIIntelligence
  identifier: aiAgentCIIntelligence
  projectIdentifier: Labs
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: account.adminGithub
        repoName: AiAgentTester
        build: <+input>
  stages:
    - stage:
        name: ci
        identifier: ci
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: k8testcluster
              namespace: default
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - stepGroup:
                  name: AI Agent - CI Intelligence
                  identifier: AI_Agent_CI_Intelligence
                  steps:
                    - step:
                        type: Agent
                        name: Agent_1
                        identifier: Agent_1
                        spec:
                          agentName: ca_ha_ha_ha
                          agentSettings:
                            llmConnector: account.harnessOpenAI
              - stepGroup:
                  name: "Actual AI Agent - CI Intelligence "
                  identifier: Actual_AI_Agent_CI_Intelligence
                  steps:
                    - step:
                        type: Agent
                        name: CI Intel Agent
                        identifier: CI_Intel_Agent
                        spec:
                          agentName: buildTurbo@1.0.0
                          agentSettings:
                            model_name: claude-opus-4-5-20251101
                            test_agent_llm_connector: ""
                            cache_intel_use_custom_key: false
                            llm_connector: account.harnessAnthropic
                            mcp_connectors:
                              - uuu
